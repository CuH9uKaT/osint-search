services:
  - type: web
    name: osint-search
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: SHERLOCK_WORKERS
        value: "2"
      - key: SITE_BATCH_SIZE
        value: "10"
      - key: CHILD_MEMORY_MB
        value: "300"
      - key: ALLOW_FULL_SEARCH
        value: "0"
      - key: RATE_SECONDS
        value: "20"
      - key: SITE_TIMEOUT_SOCIAL
        value: "15"
      - key: SEARCH_TIMEOUT_SOCIAL
        value: "300"
