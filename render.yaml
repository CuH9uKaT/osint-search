services:
  - type: web
    name: osint-search
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: SHERLOCK_WORKERS
        value: "6"
      - key: SITE_BATCH_SIZE
        value: "20"
      - key: CHILD_MEMORY_MB
        value: "384"
      - key: ALLOW_FULL_SEARCH
        value: "0"
      - key: RATE_SECONDS
        value: "15"
      - key: SITE_TIMEOUT_SOCIAL
        value: "10"
      - key: SEARCH_TIMEOUT_SOCIAL
        value: "120"
      - key: SITE_TIMEOUT_COMMUNITY
        value: "12"
      - key: SEARCH_TIMEOUT_COMMUNITY
        value: "150"
      - key: SITE_TIMEOUT_GAMING
        value: "12"
      - key: SEARCH_TIMEOUT_GAMING
        value: "150"
      - key: SITE_TIMEOUT_DEVELOPER
        value: "12"
      - key: SEARCH_TIMEOUT_DEVELOPER
        value: "150"
      - key: SITE_TIMEOUT_FULL
        value: "12"
      - key: SEARCH_TIMEOUT_FULL
        value: "210"
